<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Give It Time</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- =====================================
         ENTER THE ROOM
    ====================================== -->

    <input type="checkbox" id="enter-room">


    <!-- =====================================
         INTRODUCTION
    ====================================== -->

    <section class="intro">

        <div class="intro-content">

            <p class="eyebrow">
                AN EXERCISE IN PATIENCE
            </p>


            <h1>
                Give It Time
            </h1>


            <p class="intro-line">
                There is nothing you need to do here.
            </p>


            <p class="intro-line">
                Just stay for a while.
            </p>


            <label for="enter-room"
                   class="enter-button">

                Enter the room

            </label>

        </div>

    </section>



    <!-- =====================================
         ROOM
    ====================================== -->

    <main class="room">


        <!-- =================================
             BACK WALL
        ================================== -->

        <div class="back-wall">


            <!-- Window -->

            <div class="window">

                <div class="window-vertical"></div>

                <div class="window-horizontal"></div>

            </div>


            <!-- Picture -->

            <div class="picture-frame"></div>


        </div>



        <!-- =================================
             LEFT WALL
        ================================== -->

        <div class="left-wall">

            <div class="door"></div>

        </div>



        <!-- =================================
             FLOOR
        ================================== -->

        <div class="floor">


            <!-- Rug -->

            <div class="rug"></div>



            <!-- =================================
                 CHAIR
            ================================== -->

            <div class="chair">

                <div class="chair-back"></div>

                <div class="chair-seat"></div>

                <div class="chair-leg chair-leg-left"></div>

                <div class="chair-leg chair-leg-right"></div>

            </div>



            <!-- =================================
                 TABLE
            ================================== -->

            <div class="table">

                <div class="table-top"></div>

                <div class="table-leg table-leg-left"></div>

                <div class="table-leg table-leg-right"></div>

            </div>



            <!-- =================================
                 OBJECT 1
                 TEACUP
            ================================== -->

            <div class="object object-one">

                <img
                    src="assets/images/teacup.jpeg"
                    alt="A teacup"
                >

            </div>



            <!-- =================================
                 OBJECT 2
                 PRESSED FLOWER
            ================================== -->

            <div class="object object-two">

                <img
                    src="assets/images/pressed-flower-bouquet.jpg"
                    alt="A pressed flower bouquet"
                >

            </div>



            <!-- =================================
                 OBJECT 3
                 POSTCARD
            ================================== -->

            <div class="object object-three">

                <img
                    src="assets/images/south-carolina-postcard.jpg"
                    alt="A South Carolina postcard"
                >

            </div>



            <!-- =================================
                 OBJECT 4
                 PHOTOGRAPH
            ================================== -->

            <div class="object object-four">

                <img
                    src="assets/images/photo-with-mom.jpeg"
                    alt="A photograph"
                >

            </div>



            <!-- =================================
                 PERSON
            ================================== -->

            <div class="person">


                <div class="head"></div>


                <div class="body"></div>


                <div class="arm left-arm"></div>

                <div class="arm right-arm"></div>


                <div class="leg left-leg"></div>

                <div class="leg right-leg"></div>


            </div>


        </div>



        <!-- =================================
             ROOM TEXT
        ================================== -->

        <p class="room-message">
            Stay a little longer.
        </p>


    </main>


</body>

</html>
